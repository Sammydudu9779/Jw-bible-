
name: Build JW Bible APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP_FILE"
          mkdir source
          unzip -q "$ZIP_FILE" -d source
          PROJECT_DIR=$(find source -mindepth 1 -maxdepth 1 -type d -print -quit)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" JW-Bible.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JW-Bible-APK
          path: JW-Bible.apk
